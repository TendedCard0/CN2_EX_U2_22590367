version: '3.8'

services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin1234
      POSTGRES_DB: cetech
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.rol == basededatos 

  adminer:
    image: adminer
    ports:
      - "8081:8080"
    deploy:
      replicas: 1