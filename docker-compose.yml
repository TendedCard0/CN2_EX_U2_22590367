version: '3.8'

services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin1234
      POSTGRES_DB: cetech
    networks:
      - red_multinube
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.rol == basededatos 

  adminer:
    image: adminer
    ports:
      - "8081:8080"
    networks:
      - red_multinube
    deploy:
      replicas: 1

  app:
    image: tendedcard/cn2-agendatec:v1.0.0 
    ports:
      - "5000:5000"
    environment:
      - DB_SERVER=db 
      - DB_USER=postgres
      - DB_PASSWORD=admin1234
      - DB_NAME=cetech
    networks:
      - red_multinube
    deploy:
      replicas: 2

networks:
  red_multinube:
    driver: overlay